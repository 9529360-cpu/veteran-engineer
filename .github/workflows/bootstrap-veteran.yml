name: Bootstrap Veteran Engineer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-veteran.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=.bootstrap/veteran-engineer-bootstrap.tar.xz
          test -f "$ARCHIVE"
          echo '69f28b23615e85ce77e314eec068b3ff760d18305780888d3148fc9837e1265c  '"$ARCHIVE" | sha256sum -c -
          rm -rf /tmp/veteran-source
          mkdir -p /tmp/veteran-source
          tar -xJf "$ARCHIVE" -C /tmp/veteran-source
          SRC=/tmp/veteran-source
          if [ ! -f "$SRC/package.json" ]; then
            child_count=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
            if [ "$child_count" = '1' ]; then
              only_child=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -f "$only_child/package.json" ]; then SRC="$only_child"; fi
            fi
          fi
          test -f "$SRC/package.json"
          rsync -a --exclude='.git/' --exclude='.bootstrap/' --exclude='.github/workflows/bootstrap-veteran.yml' "$SRC/" ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-veteran.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: import Veteran Engineer 0.3.0 protocol-compatible source'
          git push origin HEAD:main
