name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 20 / npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run full validation
        run: npm run check

  container-smoke:
    name: Docker worker smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify Docker engine
        run: docker version

      - name: Resolve digest-pinned test image
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:20-alpine
          IMAGE="$(docker image inspect node:20-alpine --format '{{index .RepoDigests 0}}')"
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "Failed to resolve digest-pinned image" >&2; exit 1 ;;
          esac
          echo "Using $IMAGE"
          echo "VETERAN_CONTAINER_SMOKE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run real container worker smoke
        run: npm run test:container-smoke

  postgres-smoke:
    name: PostgreSQL state backend smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VETERAN_TEST_POSTGRES_URL: postgresql://veteran:veteran@127.0.0.1:5432/veteran

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --include=optional

      - name: Install pinned PostgreSQL driver capability
        run: npm install --no-save --package-lock=false pg@8.23.0

      - name: Start digest-pinned PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:16-alpine
          IMAGE="$(docker image inspect postgres:16-alpine --format '{{index .RepoDigests 0}}')"
          case "$IMAGE" in
            *@sha256:*) ;;
            *) echo "Failed to resolve digest-pinned PostgreSQL image" >&2; exit 1 ;;
          esac
          echo "Using $IMAGE"
          docker run -d --name veteran-postgres \
            -e POSTGRES_USER=veteran \
            -e POSTGRES_PASSWORD=veteran \
            -e POSTGRES_DB=veteran \
            -p 5432:5432 \
            "$IMAGE"

          ready_streak=0
          for attempt in $(seq 1 45); do
            if docker exec veteran-postgres \
              psql -U veteran -d veteran -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' \
              2>/dev/null | grep -qx '1'; then
              ready_streak=$((ready_streak + 1))
              if [ "$ready_streak" -ge 2 ]; then
                echo "PostgreSQL accepted two consecutive SQL probes"
                exit 0
              fi
            else
              ready_streak=0
            fi
            sleep 1
          done

          echo "PostgreSQL did not become stably SQL-ready" >&2
          docker ps -a --filter name=veteran-postgres >&2
          docker logs veteran-postgres >&2
          exit 1

      - name: Run PostgreSQL contract and durability integration
        run: npm run test:postgres

      - name: Prove PostgreSQL selection through the real MCP path
        env:
          VETERAN_ENGINEER_STATE_BACKEND: postgres
          VETERAN_ENGINEER_POSTGRES_URL: ${{ env.VETERAN_TEST_POSTGRES_URL }}
          VETERAN_ENGINEER_STATE_INSTANCE: ci-mcp-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run mcp:handshake:modern

      - name: Diagnose PostgreSQL failure
        if: failure()
        shell: bash
        run: |
          set +e
          docker ps -a --filter name=veteran-postgres
          docker logs --tail 200 veteran-postgres
