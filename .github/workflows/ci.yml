name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node 20 / npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run full validation
        run: npm run check

  browser-smoke:
    name: Chromium full-stack smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --include=optional

      - name: Resolve hosted Chromium browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_PATH=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER_PATH="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$BROWSER_PATH" ]; then
            echo "No supported Chromium browser found on the hosted runner" >&2
            exit 1
          fi
          echo "Using browser: $BROWSER_PATH"
          "$BROWSER_PATH" --version
          echo "VETERAN_TEST_BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Run real Chromium UI-to-API validation
        run: node --test tests/browser-native-validation.integration.mjs

  electron-smoke:
    name: Electron desktop smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --include=optional

      - name: Install Electron fixture and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false electron@44.3.0
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run real Electron desktop validation
        shell: bash
        run: |
          set -euo pipefail
          ELECTRON_PATH="$(node -p 'require("electron")' | tail -n 1)"
          ELECTRON_DIR="$(dirname "$ELECTRON_PATH")"
          echo "Using Electron binary: $ELECTRON_PATH"
          ls -l "$ELECTRON_PATH"
          if [ -f "$ELECTRON_DIR/chrome-sandbox" ]; then
            sudo chown root:root "$ELECTRON_DIR/chrome-sandbox"
            sudo chmod 4755 "$ELECTRON_DIR/chrome-sandbox"
            ls -l "$ELECTRON_DIR/chrome-sandbox"
          fi
          xvfb-run -a env VETERAN_TEST_ELECTRON_PATH="$ELECTRON_PATH" npm run test:electron

  container-smoke:
    name: Docker worker smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Verify Docker engine
        run: docker version

      - name: Pull trusted digest-pinned test image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="node@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293"
          docker pull "$IMAGE"
          echo "Using $IMAGE"
          echo "VETERAN_CONTAINER_SMOKE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run real container worker smoke
        run: npm run test:container-smoke

  postgres-smoke:
    name: PostgreSQL state backend smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VETERAN_TEST_POSTGRES_URL: postgresql://veteran:veteran@127.0.0.1:5432/veteran

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --include=optional

      - name: Install pinned PostgreSQL driver capability
        run: npm install --no-save --package-lock=false pg@8.23.0

      - name: Start trusted digest-pinned PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
          docker pull "$IMAGE"
          echo "Using $IMAGE"
          docker run -d --name veteran-postgres \
            -e POSTGRES_USER=veteran \
            -e POSTGRES_PASSWORD=veteran \
            -e POSTGRES_DB=veteran \
            -p 5432:5432 \
            "$IMAGE"

          ready_streak=0
          for attempt in $(seq 1 45); do
            if node <<'NODE' >/dev/null 2>&1
          const { Pool } = require('pg');
          (async () => {
            const pool = new Pool({
              connectionString: process.env.VETERAN_TEST_POSTGRES_URL,
              max: 1,
              connectionTimeoutMillis: 1000
            });
            try {
              const result = await pool.query('SELECT 1 AS ready');
              if (result.rows?.[0]?.ready !== 1) process.exitCode = 1;
            } finally {
              await pool.end().catch(() => {});
            }
          })().catch(() => { process.exitCode = 1; });
          NODE
            then
              ready_streak=$((ready_streak + 1))
              if [ "$ready_streak" -ge 2 ]; then
                echo "PostgreSQL accepted two consecutive runner-to-database SQL probes"
                exit 0
              fi
            else
              ready_streak=0
            fi
            sleep 1
          done

          echo "PostgreSQL did not become stably reachable through the Node pg path" >&2
          docker ps -a --filter name=veteran-postgres >&2
          docker logs veteran-postgres >&2
          exit 1

      - name: Run PostgreSQL contract and durability integration
        run: npm run test:postgres

      - name: Prove PostgreSQL selection through the real MCP path
        env:
          VETERAN_ENGINEER_STATE_BACKEND: postgres
          VETERAN_ENGINEER_POSTGRES_URL: ${{ env.VETERAN_TEST_POSTGRES_URL }}
          VETERAN_ENGINEER_STATE_INSTANCE: ci-mcp-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run mcp:handshake:modern

      - name: Diagnose PostgreSQL failure
        if: failure()
        shell: bash
        run: |
          set +e
          docker ps -a --filter name=veteran-postgres
          docker logs --tail 200 veteran-postgres
