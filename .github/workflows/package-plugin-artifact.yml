name: Package Plugin Artifacts

on:
  pull_request:
    paths:
      - "plugin.json"
      - ".codex-plugin/**"
      - ".mcp.json"
      - "package.json"
      - "mcp/**"
      - "src/**"
      - "tests/**"
      - "skills/runtime-regression-debugger/**"
      - "skills/frontend-design-builder/**"
      - ".github/workflows/package-plugin-artifact.yml"
  push:
    branches:
      - main
    paths:
      - "plugin.json"
      - ".codex-plugin/**"
      - ".mcp.json"
      - "package.json"
      - "mcp/**"
      - "src/**"
      - "tests/**"
      - "skills/runtime-regression-debugger/**"
      - "skills/frontend-design-builder/**"
      - ".github/workflows/package-plugin-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-plugin:
    name: Export ${{ matrix.profile }} plugin artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, codex, web, workspace]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"

      - name: Verify Workspace release workflow contract
        run: python3 .github/scripts/workspace_release_workflow_contract.py

      - name: Export profile
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE_ARGS=()
          if [ "$PROFILE" = "workspace" ]; then
            SOURCE_ARGS+=(--source-revision "$SOURCE_REVISION")
          fi
          python3 skills/runtime-regression-debugger/scripts/export_plugin_bundle.py \
            skills/runtime-regression-debugger \
            --profile "$PROFILE" \
            "${SOURCE_ARGS[@]}" \
            --output "dist/veteran-engineer-${PROFILE}.zip"

      - name: Prove reproducibility and fail-closed packaging boundaries
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SOURCE_ARGS=()
          if [ "$PROFILE" = "workspace" ]; then
            SOURCE_ARGS+=(--source-revision "$SOURCE_REVISION")
          fi
          ARCHIVE="dist/veteran-engineer-${PROFILE}.zip"
          REBUILT="dist/veteran-engineer-${PROFILE}-rebuilt.zip"
          FIRST_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          find skills/runtime-regression-debugger -type f -exec touch -t 200101010101 {} +
          python3 skills/runtime-regression-debugger/scripts/export_plugin_bundle.py \
            skills/runtime-regression-debugger \
            --profile "$PROFILE" \
            "${SOURCE_ARGS[@]}" \
            --output "$REBUILT"
          SECOND_SHA="$(sha256sum "$REBUILT" | awk '{print $1}')"
          test "$FIRST_SHA" = "$SECOND_SHA"
          rm "$REBUILT"

          LINK_PATH="skills/runtime-regression-debugger/zz-export-symlink-test"
          ln -s /etc/passwd "$LINK_PATH"
          if python3 skills/runtime-regression-debugger/scripts/export_plugin_bundle.py \
            skills/runtime-regression-debugger \
            --profile "$PROFILE" \
            "${SOURCE_ARGS[@]}" \
            --output dist/should-not-exist.zip \
            >dist/symlink-test.stdout 2>dist/symlink-test.stderr; then
            echo "Exporter unexpectedly followed a symbolic link" >&2
            exit 1
          fi
          grep -q "refuses symbolic link" dist/symlink-test.stderr
          rm -f "$LINK_PATH" dist/should-not-exist.zip dist/symlink-test.stdout dist/symlink-test.stderr

          if python3 skills/runtime-regression-debugger/scripts/export_plugin_bundle.py \
            skills/runtime-regression-debugger \
            --profile "$PROFILE" \
            "${SOURCE_ARGS[@]}" \
            --output skills/runtime-regression-debugger/should-not-exist.zip \
            >dist/self-output.stdout 2>dist/self-output.stderr; then
            echo "Exporter unexpectedly allowed output inside the Skill root" >&2
            exit 1
          fi
          grep -q "outside the Skill root" dist/self-output.stderr
          test ! -e skills/runtime-regression-debugger/should-not-exist.zip
          rm -f dist/self-output.stdout dist/self-output.stderr

          if [ "$PROFILE" = "web" ]; then
            printf '%s\n' '{"app":"approved-ci-reference"}' > dist/app.json
            python3 skills/runtime-regression-debugger/scripts/export_plugin_bundle.py \
              skills/runtime-regression-debugger \
              --profile web \
              --app-manifest dist/app.json \
              --output dist/web-with-app-positive.zip
            python3 - <<'PY'
          import json
          import zipfile
          with zipfile.ZipFile('dist/web-with-app-positive.zip') as archive:
              assert 'veteran-engineer/.app.json' in archive.namelist()
              app = json.loads(archive.read('veteran-engineer/.app.json'))
              assert app == {'app': 'approved-ci-reference'}
          PY

            ln -s app.json dist/app-link.json
            if python3 skills/runtime-regression-debugger/scripts/export_plugin_bundle.py \
              skills/runtime-regression-debugger \
              --profile web \
              --app-manifest dist/app-link.json \
              --output dist/web-with-app-symlink.zip \
              >dist/app-symlink.stdout 2>dist/app-symlink.stderr; then
              echo "Exporter unexpectedly followed a symbolic-link app manifest" >&2
              exit 1
            fi
            grep -q "refuses symbolic link app manifest" dist/app-symlink.stderr

            printf '%s\n' '{not-json' > dist/app-invalid.json
            if python3 skills/runtime-regression-debugger/scripts/export_plugin_bundle.py \
              skills/runtime-regression-debugger \
              --profile web \
              --app-manifest dist/app-invalid.json \
              --output dist/web-with-invalid-app.zip \
              >dist/app-invalid.stdout 2>dist/app-invalid.stderr; then
              echo "Exporter unexpectedly accepted malformed app manifest JSON" >&2
              exit 1
            fi
            grep -q "invalid JSON file" dist/app-invalid.stderr

            rm -f dist/app.json dist/app-link.json dist/app-invalid.json \
              dist/web-with-app-positive.zip dist/web-with-app-symlink.zip dist/web-with-invalid-app.zip \
              dist/app-symlink.stdout dist/app-symlink.stderr dist/app-invalid.stdout dist/app-invalid.stderr
          fi

      - name: Verify archive boundary and checksum
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import zipfile

          profile = os.environ["PROFILE"]
          bundle = pathlib.Path(f"dist/veteran-engineer-{profile}.zip")
          required = {
              "veteran-engineer/plugin.json",
              "veteran-engineer/.codex-plugin/plugin.json",
              "veteran-engineer/veteran-distribution.json",
              "veteran-engineer/skills/runtime-regression-debugger/SKILL.md",
              "veteran-engineer/skills/runtime-regression-debugger/agents/openai.yaml",
              "veteran-engineer/skills/runtime-regression-debugger/evals/studio_routing_scenarios.json",
              "veteran-engineer/skills/runtime-regression-debugger/evals/benchmark_scenarios.json",
              "veteran-engineer/skills/runtime-regression-debugger/references/host-capability-adaptation.md",
              "veteran-engineer/skills/runtime-regression-debugger/references/long-running-engineering-execution.md",
              "veteran-engineer/skills/runtime-regression-debugger/references/repository-engineering-execution.md",
              "veteran-engineer/skills/runtime-regression-debugger/tests/test_skill_workflow.py",
              "veteran-engineer/skills/frontend-design-builder/SKILL.md",
              "veteran-engineer/skills/frontend-design-builder/agents/openai.yaml",
              "veteran-engineer/skills/frontend-design-builder/evals/benchmark_scenarios.json",
              "veteran-engineer/skills/frontend-design-builder/scripts/frontend_context_router.py",
              "veteran-engineer/skills/frontend-design-builder/tests/test_frontend_context_router.py",
              "veteran-engineer/skills/frontend-design-builder/scripts/design_system_probe.py",
              "veteran-engineer/skills/frontend-design-builder/tests/test_design_system_probe.py",
              "veteran-engineer/skills/frontend-design-builder/scripts/design_action_router.py",
              "veteran-engineer/skills/frontend-design-builder/tests/test_design_action_router.py",
              "veteran-engineer/skills/frontend-design-builder/references/design-action-fabric.md",
              "veteran-engineer/skills/frontend-design-builder/references/design-action-recovery.md",
              "veteran-engineer/skills/frontend-design-builder/references/design-session-ledger.md",
              "veteran-engineer/skills/frontend-design-builder/references/visual-design-authority.md",
          }
          local_required = {
              "veteran-engineer/.mcp.json",
              "veteran-engineer/mcp/server.mjs",
              "veteran-engineer/src/mcp-server.mjs",
          }
          forbidden_parts = {".git", "node_modules", "__pycache__"}
          nested_runtime_prefix = "veteran-engineer/skills/runtime-regression-debugger/assets/plugin-runtime-starter/"

          with zipfile.ZipFile(bundle) as archive:
              infos = archive.infolist()
              names = [info.filename for info in infos if not info.is_dir()]
              if not names:
                  raise SystemExit("plugin archive is empty")
              if len(names) != len(set(names)):
                  raise SystemExit("plugin archive contains duplicate entries")
              missing = sorted(required.difference(names))
              if missing:
                  raise SystemExit("plugin archive missing required entries: " + ", ".join(missing))

              metadata = json.loads(archive.read("veteran-engineer/veteran-distribution.json"))
              if metadata.get("profile") != profile:
                  raise SystemExit(f"distribution profile mismatch: {metadata.get('profile')} != {profile}")
              portable_manifest = json.loads(archive.read("veteran-engineer/plugin.json"))
              if portable_manifest.get("name") != "veteran-engineering-studio":
                  raise SystemExit("portable plugin manifest identity is invalid")
              if not portable_manifest.get("version"):
                  raise SystemExit("portable plugin manifest version is missing")

              manifest = json.loads(archive.read("veteran-engineer/.codex-plugin/plugin.json"))
              if profile == "workspace":
                  provenance = metadata.get("releaseProvenance")
                  if not isinstance(provenance, dict):
                      raise SystemExit("Workspace release provenance metadata is missing")
                  if provenance.get("sourceRevision") != os.environ["SOURCE_REVISION"]:
                      raise SystemExit("Workspace release provenance does not match the GitHub source revision")
                  if provenance.get("sourceOfTruth") != "https://github.com/9529360-cpu/veteran-engineer":
                      raise SystemExit("Workspace release provenance source-of-truth is invalid")
                  if manifest.get("name") != "veteran-engineering-studio" or manifest.get("skills") != "./skills":
                      raise SystemExit("Workspace manifest identity/Skill binding is invalid")
                  if manifest.get("version") != portable_manifest.get("version"):
                      raise SystemExit("Workspace manifest and portable Studio versions differ")
                  if manifest.get("interface") != portable_manifest.get("extensions", {}).get("com.openai", {}).get("interface"):
                      raise SystemExit("Workspace manifest interface drifted from portable Studio metadata")
                  runtime_agent = archive.read("veteran-engineer/skills/runtime-regression-debugger/agents/openai.yaml").decode("utf-8")
                  frontend_agent = archive.read("veteran-engineer/skills/frontend-design-builder/agents/openai.yaml").decode("utf-8")
                  for skill_name, agent_text in {
                      "runtime-regression-debugger": runtime_agent,
                      "frontend-design-builder": frontend_agent,
                  }.items():
                      for unsupported_product in ("chatgpt", "codex", "api", "atlas"):
                          if f"- {unsupported_product}" in agent_text:
                              raise SystemExit(f"{skill_name} declares unsupported product policy metadata")
                      if "policy:" in agent_text or "allow_implicit_invocation" in agent_text:
                          raise SystemExit(f"{skill_name} declares unsupported invocation policy metadata")
              elif manifest.get("name") != "veteran-engineer" or manifest.get("skills") != "./skills/":
                  raise SystemExit("Codex compatibility manifest identity/Skill binding is invalid")

              if profile in {"desktop", "codex"}:
                  missing_local = sorted(local_required.difference(names))
                  if missing_local:
                      raise SystemExit("local profile missing runtime surfaces: " + ", ".join(missing_local))
                  if manifest.get("mcpServers") != "./.mcp.json":
                      raise SystemExit("local profile does not bind bundled MCP manifest")
              else:
                  present_local = sorted(local_required.intersection(names))
                  if present_local:
                      raise SystemExit("non-local profile contains local runtime surfaces: " + ", ".join(present_local))
                  if "mcpServers" in manifest:
                      raise SystemExit("non-local profile declares mcpServers")

              for info in infos:
                  if info.is_dir():
                      continue
                  name = info.filename
                  member = pathlib.PurePosixPath(name)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"unsafe archive member: {name}")
                  if not member.parts or member.parts[0] != "veteran-engineer":
                      raise SystemExit(f"archive member escaped plugin root: {name}")
                  if any(part in forbidden_parts for part in member.parts):
                      raise SystemExit(f"forbidden archive member: {name}")
                  if name.startswith(nested_runtime_prefix):
                      raise SystemExit(f"runtime starter duplicated inside bundled Skill: {name}")
                  if info.date_time != (1980, 1, 1, 0, 0, 0):
                      raise SystemExit(f"non-deterministic ZIP timestamp: {name} -> {info.date_time}")
                  mode = (info.external_attr >> 16) & 0o177777
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"symbolic link escaped into plugin archive: {name}")

              uncompressed_bytes = sum(info.file_size for info in infos)
              if uncompressed_bytes >= 25 * 1024 * 1024:
                  raise SystemExit(f"plugin archive is unexpectedly large: {uncompressed_bytes} bytes uncompressed")

          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          checksum = pathlib.Path(f"dist/veteran-engineer-{profile}.sha256")
          checksum.write_text(f"{digest}  {bundle.name}\n", encoding="utf-8")
          print(f"profile={profile}")
          print(f"plugin_sha256={digest}")
          print(f"plugin_bytes={bundle.stat().st_size}")
          PY

      - name: Run packaged Workspace Skill regressions
        if: matrix.profile == 'workspace'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-deps -r skills/runtime-regression-debugger/tests/requirements-ci.txt
          rm -rf dist/workspace-package-test
          mkdir -p dist/workspace-package-test
          unzip -q dist/veteran-engineer-workspace.zip -d dist/workspace-package-test
          python3 -m compileall -q             dist/workspace-package-test/veteran-engineer/skills/runtime-regression-debugger/scripts             dist/workspace-package-test/veteran-engineer/skills/runtime-regression-debugger/tests             dist/workspace-package-test/veteran-engineer/skills/frontend-design-builder/scripts             dist/workspace-package-test/veteran-engineer/skills/frontend-design-builder/tests
          python3 -m pytest -q             dist/workspace-package-test/veteran-engineer/skills/runtime-regression-debugger/tests             dist/workspace-package-test/veteran-engineer/skills/frontend-design-builder/tests

      - name: Detect publishable Studio delta
        id: studio-delta
        if: matrix.profile == 'workspace' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TRUST_ROOTS=(
            .github/workflows/ci.yml
            .github/workflows/skill-engineering-tools.yml
            .github/workflows/cross-platform-host-smoke.yml
            .github/workflows/package-plugin-artifact.yml
            .github/workflows/release.yml
            scripts/release-monotonicity.mjs
            skills/runtime-regression-debugger/scripts/workspace_release_gate.py
            skills/runtime-regression-debugger/scripts/export_plugin_bundle.py
            skills/runtime-regression-debugger/tests/requirements-ci.txt
            .github/scripts/workspace_release_workflow_contract.py
          )
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- "${TRUST_ROOTS[@]}"; then
            echo "trust_root_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "trust_root_changed=true" >> "$GITHUB_OUTPUT"
            echo "Workspace publication trust root changed in this main push; validate only and require a later clean Studio version bump before publication."
          fi
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- plugin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$BEFORE_SHA" <<'PY'
          import json
          import re
          import subprocess
          import sys

          def parse(value):
              if not isinstance(value, str) or not re.fullmatch(r"\d+\.\d+\.\d+", value):
                  raise SystemExit(f"invalid Studio semver: {value!r}")
              return tuple(int(part) for part in value.split("."))

          before = sys.argv[1]
          current = json.load(open("plugin.json", encoding="utf-8"))["version"]
          previous = json.loads(
              subprocess.check_output(["git", "show", f"{before}:plugin.json"], text=True)
          )["version"]
          if parse(current) <= parse(previous):
              raise SystemExit(f"publishable Studio version did not increase: {previous} -> {current}")
          print(f"publishable Studio delta: {previous} -> {current}")
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Require merged PR provenance
        if: matrix.profile == 'workspace' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.studio-delta.outputs.changed == 'true' && steps.studio-delta.outputs.trust_root_changed == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/commits/{sha}/pulls"
          deadline = time.time() + 2 * 60
          pulls = []
          merged = []
          while True:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "veteran-workspace-pr-provenance-gate",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  pulls = json.load(response)
              merged = [
                  pr for pr in pulls
                  if pr.get("merged_at")
                  and pr.get("base", {}).get("ref") == "main"
                  and pr.get("merge_commit_sha") == sha
              ]
              if len(merged) == 1:
                  break
              if len(merged) > 1 or time.time() >= deadline:
                  summary = [
                      {
                          "number": pr.get("number"),
                          "merged_at": pr.get("merged_at"),
                          "base": pr.get("base", {}).get("ref"),
                          "merge_commit_sha": pr.get("merge_commit_sha"),
                      }
                      for pr in pulls[:20]
                  ]
                  raise SystemExit(
                      f"publishable Workspace revision must map to exactly one merged PR "
                      f"whose merge_commit_sha is {sha}; matches={len(merged)} associated={summary}"
                  )
              print("merged PR association not visible yet; retrying")
              time.sleep(5)

          pr = merged[0]
          print(
              f"merged PR provenance verified: #{pr.get('number')} "
              f"merge_commit_sha={sha} base=main"
          )
          PY

      - name: Require exact-main validation workflows
        id: release-ready
        if: matrix.profile == 'workspace' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.studio-delta.outputs.changed == 'true' && steps.studio-delta.outputs.trust_root_changed == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          required = {
              356929464: "CI",
              358643055: "Skill Engineering Tools",
              358628814: "Cross-platform host smoke",
              358757508: "Release",
          }
          repo = os.environ["REPOSITORY"]
          sha = os.environ["HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.time() + 20 * 60
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs?"
              + urllib.parse.urlencode({"head_sha": sha, "per_page": 100})
          )

          while True:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "veteran-workspace-release-gate",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except (urllib.error.URLError, TimeoutError) as exc:
                  if time.time() >= deadline:
                      raise SystemExit(f"timed out reading exact-main workflow status: {exc}")
                  time.sleep(10)
                  continue

              by_workflow = {}
              for run in payload.get("workflow_runs", []):
                  if run.get("head_sha") != sha or run.get("event") != "push":
                      continue
                  workflow_id = run.get("workflow_id")
                  if workflow_id not in required:
                      continue
                  if run.get("name") != required[workflow_id]:
                      raise SystemExit(
                          f"trusted workflow identity/name mismatch: "
                          f"{workflow_id} expected={required[workflow_id]!r} got={run.get('name')!r}"
                      )
                  previous = by_workflow.get(workflow_id)
                  if previous is None or str(run.get("created_at", "")) > str(previous.get("created_at", "")):
                      by_workflow[workflow_id] = run

              missing = sorted(
                  f"{workflow_id}:{name}"
                  for workflow_id, name in required.items()
                  if workflow_id not in by_workflow
              )
              failed = {
                  f"{workflow_id}:{required[workflow_id]}": run.get("conclusion")
                  for workflow_id, run in by_workflow.items()
                  if run.get("status") == "completed" and run.get("conclusion") != "success"
              }
              if failed:
                  raise SystemExit(f"exact-main validation workflow failed for {sha}: {failed}")
              pending = sorted(
                  f"{workflow_id}:{required[workflow_id]}"
                  for workflow_id, run in by_workflow.items()
                  if run.get("status") != "completed"
              )
              if not missing and not pending:
                  print(
                      f"exact-main validation workflows passed for {sha}: "
                      f"{[f'{workflow_id}:{name}' for workflow_id, name in required.items()]}"
                  )
                  break
              if time.time() >= deadline:
                  raise SystemExit(
                      f"timed out waiting for exact-main validation workflows for {sha}; "
                      f"missing={missing} pending={pending}"
                  )
              print(f"waiting for exact-main validation workflows; missing={missing} pending={pending}")
              time.sleep(10)
          PY

      - name: Require sibling package profiles
        if: steps.release-ready.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          required = {
              "Export desktop plugin artifact",
              "Export codex plugin artifact",
              "Export web plugin artifact",
          }
          repo = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.time() + 10 * 60
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?"
              + urllib.parse.urlencode({"per_page": 100})
          )

          while True:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "veteran-workspace-profile-parity-gate",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except (urllib.error.URLError, TimeoutError) as exc:
                  if time.time() >= deadline:
                      raise SystemExit(f"timed out reading sibling package jobs: {exc}")
                  time.sleep(5)
                  continue

              by_name = {
                  job.get("name"): job
                  for job in payload.get("jobs", [])
                  if job.get("name") in required
              }
              missing = sorted(required.difference(by_name))
              failed = {
                  name: job.get("conclusion")
                  for name, job in by_name.items()
                  if job.get("status") == "completed" and job.get("conclusion") != "success"
              }
              if failed:
                  raise SystemExit(f"sibling package profile failed: {failed}")
              pending = sorted(
                  name for name, job in by_name.items()
                  if job.get("status") != "completed"
              )
              if not missing and not pending:
                  print(f"sibling package profiles passed: {sorted(required)}")
                  break
              if time.time() >= deadline:
                  raise SystemExit(
                      f"timed out waiting for sibling package profiles; "
                      f"missing={missing} pending={pending}"
                  )
              print(f"waiting for sibling package profiles; missing={missing} pending={pending}")
              time.sleep(5)
          PY

      - name: Stage workspace install artifact
        if: matrix.profile == 'workspace' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.studio-delta.outputs.changed == 'true' && steps.studio-delta.outputs.trust_root_changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/workspace-install
          mkdir -p dist/workspace-install
          python3 - <<'PY'
          import pathlib
          import shutil
          import zipfile

          source = pathlib.Path("dist/veteran-engineer-workspace.zip")
          target = pathlib.Path("dist/workspace-install")
          prefix = "veteran-engineer/"
          with zipfile.ZipFile(source) as archive:
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  if not info.filename.startswith(prefix):
                      raise SystemExit(f"workspace member escaped plugin root: {info.filename}")
                  rel = pathlib.PurePosixPath(info.filename[len(prefix):])
                  if not rel.parts or rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"unsafe workspace install member: {info.filename}")
                  destination = target.joinpath(*rel.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(info) as src, destination.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          required = [
              target / "plugin.json",
              target / ".codex-plugin" / "plugin.json",
              target / "skills" / "runtime-regression-debugger" / "SKILL.md",
              target / "skills" / "frontend-design-builder" / "SKILL.md",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("workspace install staging missing: " + ", ".join(missing))
          PY

      - name: Gate staged Workspace publication candidate
        if: matrix.profile == 'workspace' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.studio-delta.outputs.changed == 'true' && steps.studio-delta.outputs.trust_root_changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          STUDIO_VERSION="$(python3 - <<'PY'
          import json
          print(json.load(open("plugin.json", encoding="utf-8"))["version"])
          PY
          )"
          rm -f dist/workspace-install-candidate.zip
          (
            cd dist/workspace-install
            zip -q -r ../workspace-install-candidate.zip .
          )
          python3 skills/runtime-regression-debugger/scripts/workspace_release_gate.py             dist/workspace-install-candidate.zip             --expected-revision "$GITHUB_SHA"             --expected-version "$STUDIO_VERSION"             --json

      - name: Upload workspace install artifact
        if: matrix.profile == 'workspace' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.studio-delta.outputs.changed == 'true' && steps.studio-delta.outputs.trust_root_changed == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veteran-engineering-studio-workspace-install-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/workspace-install/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload profile artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veteran-engineer-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/veteran-engineer-${{ matrix.profile }}.zip
            dist/veteran-engineer-${{ matrix.profile }}.sha256
          if-no-files-found: error
          retention-days: 7
