name: Skill Engineering Tools

on:
  pull_request:
    paths:
      - "skills/runtime-regression-debugger/**"
      - "skills/frontend-design-builder/**"
      - "plugin.json"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/skill-engineering-tools.yml"
  push:
    branches:
      - main
    paths:
      - "skills/runtime-regression-debugger/**"
      - "skills/frontend-design-builder/**"
      - "plugin.json"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/skill-engineering-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tools:
    name: Studio Skill and routing regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require Studio version bump for packaged Skill changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          def parse(value):
              if not isinstance(value, str) or not re.fullmatch(r"\d+\.\d+\.\d+", value):
                  raise SystemExit(f"invalid Studio semver: {value!r}")
              return tuple(int(part) for part in value.split("."))

          base = os.environ.get("BASE_SHA", "").strip()
          if not base or set(base) == {"0"}:
              print("studio_version_gate=skipped_no_base")
              raise SystemExit(0)

          subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"], check=True)
          current = json.load(open("plugin.json", encoding="utf-8"))
          previous = json.loads(
              subprocess.check_output(["git", "show", f"{base}:plugin.json"], text=True)
          )
          current_version = parse(current.get("version"))
          previous_version = parse(previous.get("version"))
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"],
              text=True,
          ).splitlines()
          packaged_skill_changes = [
              path for path in changed
              if path == "plugin.json"
              or path.startswith("skills/frontend-design-builder/")
              or (
                  path.startswith("skills/runtime-regression-debugger/")
                  and not path.startswith(
                      "skills/runtime-regression-debugger/assets/plugin-runtime-starter/"
                  )
              )
          ]

          if current_version < previous_version:
              raise SystemExit(
                  f"Studio version regressed: {previous['version']} -> {current['version']}"
              )
          if packaged_skill_changes and current_version <= previous_version:
              raise SystemExit(
                  "Studio package changed without a strict version increase: "
                  f"{previous['version']} -> {current['version']}\n"
                  + "\n".join(packaged_skill_changes[:50])
              )
          print(
              f"studio_version={current['version']} previous={previous['version']} "
              f"packaged_changes={len(packaged_skill_changes)}"
          )
          PY

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Skill test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile Skill engineering tools
        run: python -m compileall -q skills/runtime-regression-debugger/scripts skills/runtime-regression-debugger/tests skills/frontend-design-builder/scripts skills/frontend-design-builder/tests

      - name: Run Skill engineering tool regressions
        run: python -m pytest -q skills/runtime-regression-debugger/tests skills/frontend-design-builder/tests
