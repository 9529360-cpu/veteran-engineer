name: Skill Engineering Tools

on:
  pull_request:
    paths:
      - "skills/runtime-regression-debugger/**"
      - "skills/frontend-design-builder/**"
      - "plugin.json"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/skill-engineering-tools.yml"
  push:
    branches:
      - main
    paths:
      - "skills/runtime-regression-debugger/**"
      - "skills/frontend-design-builder/**"
      - "plugin.json"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/skill-engineering-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Studio Skill regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Skill test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Skill engineering tools
        run: python -m compileall -q skills/runtime-regression-debugger/scripts skills/runtime-regression-debugger/tests

      - name: Run Skill engineering tool regressions
        run: python -m pytest -q skills/runtime-regression-debugger/tests
