name: Cross-platform host smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-smoke:
    name: ${{ matrix.os }} / Node 20 host smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run installer contract tests
        run: npm run test:installer

      - name: Run CLI contract tests
        run: npm run test:cli

      - name: Run release bootstrap contract tests
        run: node --test tests/release-bootstrap.test.mjs

      - name: Run Remote Host Windows service smoke
        if: runner.os == 'Windows'
        run: node --test tests/remote-host-service.windows.integration.mjs

      - name: Resolve Windows Chromium browser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $browser) { throw "No supported Chromium browser found on the Windows hosted runner" }
          Write-Host "Using browser: $browser"
          & $browser --version
          "VETERAN_TEST_BROWSER_PATH=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run real Windows Chromium UI-to-API validation
        if: runner.os == 'Windows'
        run: node --test tests/browser-native-validation.integration.mjs

      - name: Probe host discovery
        run: node bin/veteran-engineer.mjs hosts
