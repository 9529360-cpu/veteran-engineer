name: Generate PostgreSQL Lockfiles

on:
  push:
    branches:
      - feature/postgres-state-backend
    paths:
      - '.github/workflows/generate-postgres-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Generate exact optional dependency lockfiles
        run: npm install --package-lock-only --ignore-scripts --save-optional --save-exact pg@8.23.0

      - name: Verify generated dependency
        run: |
          node -e "const p=require('./package.json'); if(p.optionalDependencies?.pg!=='8.23.0') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.packages?.['']?.optionalDependencies?.pg!=='8.23.0') process.exit(1)"

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: postgres-lockfiles
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
