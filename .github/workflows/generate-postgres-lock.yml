name: Generate PostgreSQL Lockfiles

on:
  push:
    branches:
      - feature/postgres-state-backend
    paths:
      - '.github/workflows/generate-postgres-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/postgres-state-backend

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Regenerate exact lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Mirror runtime-starter lockfile
        run: cp package-lock.json skills/runtime-regression-debugger/assets/plugin-runtime-starter/package-lock.json

      - name: Verify PostgreSQL and MCP pins
        run: |
          node -e "const p=require('./package.json'); if(p.optionalDependencies?.pg!=='8.23.0') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.packages?.['node_modules/pg']?.version!=='8.23.0') process.exit(1)"
          node scripts/check.mjs

      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json skills/runtime-regression-debugger/assets/plugin-runtime-starter/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current'
            exit 0
          fi
          git commit -m 'build: regenerate PostgreSQL lockfiles'
          git push origin HEAD:feature/postgres-state-backend
