name: Runtime Release V2

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-release-v2.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-release-v2.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  register:
    name: Register Runtime Release V2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prove validation-only registration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW" = "Runtime Release V2"
          echo "runtime_release_v2_registration=ok"
          echo "sha=$GITHUB_SHA"
