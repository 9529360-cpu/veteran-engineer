name: Package Skill Artifact

on:
  push:
    branches:
      - ci/package-skill-artifact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-skill-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify skill source
        shell: bash
        run: |
          set -euo pipefail
          test -f skills/runtime-regression-debugger/SKILL.md
          test -f skills/runtime-regression-debugger/agents/openai.yaml
          test -f skills/runtime-regression-debugger/assets/plugin-runtime-starter/.mcp.json
          test -f skills/runtime-regression-debugger/assets/plugin-runtime-starter/.codex-plugin/plugin.json
          bytes=$(du -sb skills/runtime-regression-debugger | awk '{print $1}')
          test "$bytes" -lt 26214400
          echo "skill_bytes=$bytes"
          echo "source_head=$(git rev-parse HEAD)"

      - name: Upload skill source
        uses: actions/upload-artifact@v4
        with:
          name: runtime-regression-debugger-source
          path: skills/runtime-regression-debugger
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
